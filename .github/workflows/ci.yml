name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    env:
      ELISP_CI_GNU_MIRROR: ustc
      ELISP_CI_NONGNU_MIRROR: ustc
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"
          - "31.1"

    steps:
      - uses: actions/checkout@v5

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@v0.1.2
        with:
          fail-on-warning: "false"
          gnu-mirror: "ustc"
          nongnu-mirror: "ustc"

      - name: Run Tests
        uses: tychoish/elisp-ci@v0.1.2
        with:
          gnu-mirror: "ustc"
          nongnu-mirror: "ustc"
          dependencies: denote-dash
